# Test, lint, type-check, check licensing and run the examples.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14", "3.15"]
    # Python 3.15 may still be a pre-release: report it but don't block merges
    continue-on-error: ${{ matrix.python-version == '3.15' }}
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: pytest (coverage floor in pyproject.toml)
        run: |
          pytest --doctest-modules spectraxai tests \
            --junitxml=test-results.xml \
            --cov --cov-report=xml --cov-report=term
      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            test-results.xml
            coverage.xml

  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: flake8
        run: flake8 --max-line-length=88 --extend-ignore=E203,E731 spectraxai tests examples
      - name: black
        run: black --check spectraxai tests examples
      - name: pyright
        run: pyright

  reuse:
    name: REUSE licensing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: fsfe/reuse-action@v5

  examples:
    name: Examples
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Run example scripts
        run: for script in examples/*.py; do python "$script" || exit 1; done
      # The PyCaret notebook (examples/pycaret/) is excluded until PyCaret 4.0 is stable
      - name: Run example notebooks
        run: pytest --nbmake --nbmake-kernel=python3 --nbmake-timeout=1800 examples/*.ipynb
